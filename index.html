<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Workflow Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <header>
      <h1>Visual Workflow Builder</h1>
    </header>

    <main class="app">
      <aside class="library">
        <h2>Blocks</h2>
        <div class="block" draggable="true" data-type="Trigger">Trigger</div>
        <div class="block" draggable="true" data-type="Action">Action</div>
        <div class="block" draggable="true" data-type="Condition">Condition</div>
        <div class="block" draggable="true" data-type="AI">AI</div>
      </aside>

      <button type="button" id="clear-btn">Clear Workflow</button>
      <p id="step-count">Total Steps: 0</p>
      <p id="status-msg" aria-live="polite"></p>
      <section class="canvas" id="canvas"></section>

      <section class="storage-panel">
        <h2>Saved Workflows</h2>
        <input type="text" id="workflow-name-input" placeholder="Enter workflow name...">
        <button type="button" id="save-btn">Save Workflow</button>
        <ul id="saved-workflows-list"></ul>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
